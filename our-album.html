<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我们的相册</title>
<style>
/* ============================================
   Apple Design System — Foundations
   ============================================ */

:root {
  font: 100%/1.5 system-ui, -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-optical-sizing: auto;

  --bg-primary: #f5f5f7;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0f0f2;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --accent: #ff6b8a;
  --accent-bg: rgba(255,107,138,0.08);
  --danger: #ff3b30;
  --danger-bg: rgba(255,59,48,0.08);
  --divider: rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --glass-bg: rgba(255,255,255,0.72);
  --glass-blur: blur(24px) saturate(180%);
  --glass-border: rgba(0,0,0,0.06);

  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --duration-fast: 120ms;
  --duration-normal: 200ms;
  --duration-slow: 350ms;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #000000;
    --bg-secondary: #1c1c1e;
    --bg-tertiary: #2c2c2e;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --text-tertiary: #636366;
    --accent-bg: rgba(255,107,138,0.12);
    --danger-bg: rgba(255,69,58,0.12);
    --divider: rgba(255,255,255,0.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
    --glass-bg: rgba(28,28,30,0.72);
    --glass-border: rgba(255,255,255,0.08);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

@media (prefers-reduced-transparency: reduce) {
  :root { --glass-bg: var(--bg-secondary); --glass-blur: none; }
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ============ Login ============ */
.login-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: var(--space-lg);
  background: var(--bg-primary);
}

.login-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-xl);
  padding: var(--space-2xl) var(--space-xl);
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--divider);
}

.login-card .icon { font-size: 44px; margin-bottom: var(--space-md); display: block; }

.login-card h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text-primary);
  margin-bottom: var(--space-xs);
}

.login-card .subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: var(--space-xl);
  line-height: 1.4;
}

.login-card .input-group { position: relative; margin-bottom: var(--space-md); }

.login-card input {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--divider);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
  -webkit-appearance: none;
}

.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.login-card input::placeholder { color: var(--text-tertiary); }

.login-card button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-full);
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
  letter-spacing: -0.01em;
}

.login-card button:active { transform: scale(0.97); }
.login-card button:hover { opacity: 0.92; }

.login-card .error {
  color: var(--danger);
  font-size: 13px;
  margin-top: var(--space-sm);
  display: none;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ============ Main ============ */
.main-wrap {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--space-2xl) + env(safe-area-inset-bottom, 0px));
}

/* ============ Header — Glass ============ */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 0.5px solid var(--glass-border);
  padding: 12px var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  line-height: 1.2;
}

.header .logout-btn {
  background: var(--bg-tertiary);
  border: none;
  color: var(--text-secondary);
  padding: 7px 16px;
  border-radius: var(--radius-full);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
  letter-spacing: -0.01em;
}

.header .logout-btn:active { transform: scale(0.95); background: var(--divider); }

/* ============ Album Tabs ============ */
.album-tabs {
  display: flex;
  gap: var(--space-sm);
  padding: var(--space-md);
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.album-tabs::-webkit-scrollbar { display: none; }

.album-tab {
  flex-shrink: 0;
  padding: 9px 20px;
  border-radius: var(--radius-full);
  border: none;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
  letter-spacing: -0.01em;
}

.album-tab:active { transform: scale(0.95); }
.album-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
.album-tab .count { font-size: 12px; margin-left: 4px; opacity: 0.7; }

.album-tab.add {
  background: transparent;
  border: 1.5px dashed var(--divider);
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
}

.album-tab.add:active { transform: scale(0.95); border-color: var(--accent); color: var(--accent); }

/* ============ Actions Bar ============ */
.actions-bar {
  display: flex;
  gap: var(--space-sm);
  padding: 0 var(--space-md) var(--space-md);
  flex-wrap: wrap;
}

.actions-bar button {
  padding: 9px 18px;
  border-radius: var(--radius-full);
  border: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out), opacity var(--duration-fast) var(--ease-out);
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 5px;
}

.actions-bar button:active { transform: scale(0.97); }
.actions-bar button.primary { background: var(--accent); color: #fff; }
.actions-bar button.secondary { background: var(--bg-tertiary); color: var(--text-primary); }
.actions-bar button.danger { background: var(--bg-tertiary); color: var(--danger); }
.actions-bar button:hover { opacity: 0.85; }

/* ============ Photo Grid ============ */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: var(--space-sm);
  padding: 0 var(--space-md);
}

.photo-item {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  aspect-ratio: 3/4;
  background: var(--bg-tertiary);
  cursor: pointer;
  border: none;
  transition: transform var(--duration-normal) var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .photo-item:hover { transform: scale(1.03); }
}

.photo-item:active { transform: scale(0.97); }

.photo-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity var(--duration-normal) var(--ease-out);
  opacity: 0;
}

.photo-item img.loaded { opacity: 1; }

.photo-item .photo-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--duration-normal) var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .photo-item:hover .photo-actions { opacity: 1; }
}

.photo-item .photo-actions button {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: none;
  background: rgba(0,0,0,0.45);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
}

.photo-item .photo-actions button:active { transform: scale(0.85); background: var(--danger); }

/* ============ Empty State ============ */
.empty-state {
  text-align: center;
  padding: var(--space-2xl) var(--space-lg);
  color: var(--text-tertiary);
}

.empty-state .icon { font-size: 56px; margin-bottom: var(--space-md); opacity: 0.5; display: block; }
.empty-state p { font-size: 16px; color: var(--text-secondary); letter-spacing: -0.01em; }

/* ============ Lightbox ============ */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.96);
  flex-direction: column;
}

.lightbox.open { display: flex; }

.lightbox .top-bar {
  display: flex;
  justify-content: space-between;
  padding: 12px var(--space-md);
  padding-top: max(12px, env(safe-area-inset-top));
}

.lightbox .top-bar button {
  background: rgba(255,255,255,0.12);
  border: none;
  color: #fff;
  padding: 9px 18px;
  border-radius: var(--radius-full);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  letter-spacing: -0.01em;
}

.lightbox .top-bar button:active { transform: scale(0.95); }

.lightbox .img-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-md);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-x;
}

.lightbox .img-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 4px;
}

.lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); }
.lightbox .nav.prev { left: 8px; }
.lightbox .nav.next { right: 8px; }

.lightbox .nav button {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  border: none;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
}

.lightbox .nav button:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }

.lightbox .info {
  text-align: center;
  padding: 12px var(--space-md);
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

/* ============ Modal ============ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  align-items: center;
  justify-content: center;
  padding: var(--space-lg);
  animation: fadeIn 200ms var(--ease-out);
}

.modal-overlay.open { display: flex; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-secondary);
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  width: 100%;
  max-width: 360px;
  box-shadow: var(--shadow-lg);
  transform-origin: center;
  animation: modalEnter 300ms var(--ease-drawer);
}

@keyframes modalEnter {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.modal h3 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: var(--space-md);
  color: var(--text-primary);
  line-height: 1.3;
}

.modal .modal-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
  line-height: 1.4;
}

.modal input {
  width: 100%;
  padding: 13px 15px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--divider);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 16px;
  outline: none;
  transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
}

.modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

.modal .btns { display: flex; gap: var(--space-sm); margin-top: var(--space-md); justify-content: flex-end; }

.modal .btns button {
  padding: 10px 22px;
  border-radius: var(--radius-full);
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-out);
  letter-spacing: -0.01em;
}

.modal .btns button:active { transform: scale(0.95); }
.modal .btns button.cancel { background: var(--bg-tertiary); color: var(--text-primary); }
.modal .btns button.confirm { background: var(--accent); color: #fff; font-weight: 600; }
.modal .btns button.danger { background: var(--danger); color: #fff; font-weight: 600; }

/* ============ Upload Progress ============ */
.upload-progress {
  position: fixed;
  bottom: calc(var(--space-xl) + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  border-radius: var(--radius-full);
  padding: 12px 20px;
  z-index: 150;
  display: none;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow-md);
}

.upload-progress .label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.upload-progress .bar {
  width: 100px;
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  overflow: hidden;
}

.upload-progress .bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 300ms var(--ease-out);
}

/* ============ Toast ============ */
.toast {
  position: fixed;
  top: calc(var(--space-md) + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(-120%);
  background: var(--bg-secondary);
  border: 0.5px solid var(--divider);
  border-radius: var(--radius-full);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  box-shadow: var(--shadow-md);
  z-index: 350;
  transition: transform 300ms var(--ease-drawer);
  pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* ============ Responsive ============ */
@media (max-width: 480px) {
  .photo-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
  .header h1 { font-size: 17px; }
  .album-tabs { padding: 12px var(--space-md); gap: 6px; }
  .album-tab { padding: 8px 16px; font-size: 13px; }
  .actions-bar { padding: 0 var(--space-md) 14px; gap: 6px; }
  .actions-bar button { padding: 8px 14px; font-size: 13px; }
  .login-card { padding: var(--space-xl) var(--space-lg); }
  .login-card h1 { font-size: 24px; }
}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <span class="icon">📸</span>
    <h1>我们的相册</h1>
    <p class="subtitle">属于谢林海 &amp; 曾子珊的专属记忆</p>
    <div class="input-group">
      <input type="password" id="pwdInput" placeholder="请输入口令" autofocus autocomplete="off">
    </div>
    <button onclick="checkPwd()">进入相册</button>
    <div class="error" id="loginError">口令错误，再试一次</div>
  </div>
</div>

<div class="main-wrap" id="mainWrap">
  <div class="header">
    <h1>我们的相册</h1>
    <button class="logout-btn" onclick="logout()">退出</button>
  </div>
  <div class="album-tabs" id="albumTabs"></div>
  <div class="actions-bar" id="actionsBar"></div>
  <div class="photo-grid" id="photoGrid"></div>
  <div class="empty-state" id="emptyState">
    <span class="icon">🖼️</span>
    <p>还没有照片，点击上方按钮添加吧</p>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="top-bar">
    <button onclick="downloadCurrentPhoto()">下载</button>
    <button onclick="closeLightbox()">关闭</button>
  </div>
  <div class="nav prev"><button onclick="lightboxNav(-1)">‹</button></div>
  <div class="nav next"><button onclick="lightboxNav(1)">›</button></div>
  <div class="img-wrap" id="lightboxWrap">
    <img id="lightboxImg" src="" alt="" draggable="false">
  </div>
  <div class="info" id="lightboxInfo"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="upload-progress" id="uploadProgress">
  <span class="label" id="progressLabel">上传中</span>
  <div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">

<script>
const DB_NAME = 'OurAlbumDB_v2';
const DB_VER = 1;
const PASSWORD = 'wantaoxxx';
let db = null;
let currentAlbum = '默认相册';
let lightboxPhotos = [];
let lightboxIndex = 0;
let isSwiping = false;
let lightboxStartX = 0;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('photos')) {
        const s = d.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
        s.createIndex('album', 'album', { unique: false });
        s.createIndex('timestamp', 'timestamp', { unique: false });
      }
      if (!d.objectStoreNames.contains('albums')) d.createObjectStore('albums', { keyPath: 'name' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function ensureDefaultAlbum() {
  return new Promise((resolve) => {
    const tx = db.transaction('albums', 'readwrite');
    const s = tx.objectStore('albums');
    const r = s.get('默认相册');
    r.onsuccess = () => { if (!r.result) s.put({ name: '默认相册', created: Date.now() }); resolve(); };
  });
}

function checkPwd() {
  const input = document.getElementById('pwdInput').value.trim();
  if (input === PASSWORD) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    initApp();
  } else {
    const err = document.getElementById('loginError');
    err.style.display = 'block';
    err.style.animation = 'none';
    err.offsetHeight;
    err.style.animation = 'shake 400ms cubic-bezier(0.23, 1, 0.32, 1)';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
  }
}

document.getElementById('pwdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPwd(); });

function logout() {
  if (!confirm('确定要退出吗？')) return;
  document.getElementById('mainWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('pwdInput').value = '';
  document.getElementById('loginError').style.display = 'none';
  closeLightbox();
}

async function initApp() { await openDB(); await ensureDefaultAlbum(); await renderAlbums(); await renderPhotos(); }

async function getAlbums() {
  return new Promise((r) => {
    const tx = db.transaction('albums', 'readonly');
    tx.objectStore('albums').getAll().onsuccess = (e) => r(e.target.result || []);
  });
}

async function getPhotoCount(album) {
  return new Promise((r) => {
    const tx = db.transaction('photos', 'readonly');
    tx.objectStore('photos').index('album').count(album).onsuccess = (e) => r(e.target.result);
  });
}

async function renderAlbums() {
  const albums = await getAlbums();
  const c = document.getElementById('albumTabs');
  let html = '';
  for (const a of albums) {
    const cnt = await getPhotoCount(a.name);
    html += `<div class="album-tab${a.name===currentAlbum?' active':''}" onclick="switchAlbum('${esc(a.name)}')">${esc(a.name)}<span class="count">${cnt}</span></div>`;
  }
  html += '<div class="album-tab add" onclick="showAddAlbum()">+ 新建相册</div>';
  c.innerHTML = html;
}

function switchAlbum(name) { currentAlbum = name; renderAlbums(); renderPhotos(); }

function showAddAlbum() {
  showModal('新建相册',
    '<input type="text" id="newAlbumName" placeholder="输入相册名称" maxlength="20" autocomplete="off">'+
    '<div class="btns"><button class="cancel" onclick="closeModal()">取消</button><button class="confirm" onclick="addAlbum()">创建</button></div>');
  setTimeout(() => document.getElementById('newAlbumName')?.focus(), 150);
}

async function addAlbum() {
  const name = document.getElementById('newAlbumName').value.trim();
  if (!name) return;
  const tx = db.transaction('albums', 'readwrite');
  const s = tx.objectStore('albums');
  const ex = await new Promise(r => { s.get(name).onsuccess = (e) => r(e.target.result); });
  if (ex) { showToast('相册已存在'); return; }
  s.put({ name, created: Date.now() });
  closeModal();
  currentAlbum = name;
  await renderAlbums();
  await renderPhotos();
}

async function renameAlbum() {
  if (currentAlbum === '默认相册') { showToast('默认相册不能重命名'); return; }
  showModal('重命名相册',
    `<input type="text" id="renameInput" value="${esc(currentAlbum)}" maxlength="20" autocomplete="off">`+
    '<div class="btns"><button class="cancel" onclick="closeModal()">取消</button><button class="confirm" onclick="doRenameAlbum()">确认</button></div>');
}

async function doRenameAlbum() {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName || newName===currentAlbum) { closeModal(); return; }
  const txP = db.transaction('photos','readwrite');
  const pS = txP.objectStore('photos');
  const idx = pS.index('album');
  const photos = await new Promise(r => { idx.getAll(currentAlbum).onsuccess = (e) => r(e.target.result); });
  for (const p of photos) { p.album = newName; pS.put(p); }
  const txA = db.transaction('albums','readwrite');
  const aS = txA.objectStore('albums');
  aS.delete(currentAlbum);
  aS.put({ name: newName, created: Date.now() });
  currentAlbum = newName;
  closeModal();
  await renderAlbums();
  await renderPhotos();
}

async function deleteAlbum() {
  if (currentAlbum === '默认相册') { showToast('默认相册不能删除'); return; }
  const cnt = await getPhotoCount(currentAlbum);
  showModal('删除相册',
    `<p class="modal-desc">确定删除相册「${esc(currentAlbum)}」及其全部 ${cnt} 张照片？此操作不可撤销。</p>`+
    '<div class="btns"><button class="cancel" onclick="closeModal()">取消</button><button class="danger" onclick="doDeleteAlbum()">删除</button></div>');
}

async function doDeleteAlbum() {
  const txP = db.transaction('photos','readwrite');
  const pS = txP.objectStore('photos');
  const idx = pS.index('album');
  const photos = await new Promise(r => { idx.getAll(currentAlbum).onsuccess = (e) => r(e.target.result); });
  for (const p of photos) pS.delete(p.id);
  const txA = db.transaction('albums','readwrite');
  txA.objectStore('albums').delete(currentAlbum);
  currentAlbum = '默认相册';
  closeModal();
  await renderAlbums();
  await renderPhotos();
}

async function getPhotos(album) {
  return new Promise((r) => {
    const tx = db.transaction('photos','readonly');
    tx.objectStore('photos').index('album').getAll(album).onsuccess = (e) => {
      const list = e.target.result || [];
      list.sort((a,b) => b.timestamp - a.timestamp);
      r(list);
    };
  });
}

async function renderPhotos() {
  const photos = await getPhotos(currentAlbum);
  document.getElementById('actionsBar').innerHTML =
    '<button class="primary" onclick="document.getElementById(\'fileInput\').click()">上传照片</button>'+
    '<button class="secondary" onclick="renameAlbum()">重命名</button>'+
    '<button class="danger" onclick="deleteAlbum()">删除相册</button>';

  if (photos.length===0) {
    document.getElementById('photoGrid').innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
  } else {
    document.getElementById('emptyState').style.display = 'none';
    let html = '';
    photos.forEach((p,i) => {
      html += `<div class="photo-item" onclick="openLightbox(${i})"><img src="${p.data}" alt="" loading="lazy" onload="this.classList.add('loaded')" onerror="this.parentElement.remove()"><div class="photo-actions"><button onclick="event.stopPropagation();downloadPhoto(${p.id})">↓</button><button onclick="event.stopPropagation();deletePhoto(${p.id})">×</button></div></div>`;
    });
    document.getElementById('photoGrid').innerHTML = html;
  }
  window._currentPhotos = photos;
}

function handleFiles(files) { if (files&&files.length) uploadFiles(Array.from(files),0); }

async function uploadFiles(files, idx) {
  if (idx >= files.length) {
    document.getElementById('uploadProgress').style.display = 'none';
    await renderAlbums();
    await renderPhotos();
    showToast(`已添加 ${files.length} 张照片`);
    return;
  }
  const pg = document.getElementById('uploadProgress');
  pg.style.display = 'flex';
  document.getElementById('progressFill').style.width = Math.round((idx/files.length)*100)+'%';
  document.getElementById('progressLabel').textContent = `正在添加 ${idx+1}/${files.length}`;

  const reader = new FileReader();
  reader.onload = (e) => {
    const tx = db.transaction('photos','readwrite');
    const s = tx.objectStore('photos');
    s.add({ album: currentAlbum, name: files[idx].name, data: e.target.result, timestamp: Date.now() });
    tx.oncomplete = () => uploadFiles(files, idx+1);
    tx.onerror = () => uploadFiles(files, idx+1);
  };
  reader.readAsDataURL(files[idx]);
}

function deletePhoto(id) {
  if (!confirm('确定删除这张照片吗？')) return;
  const tx = db.transaction('photos','readwrite');
  tx.objectStore('photos').delete(Number(id));
  tx.oncomplete = async () => { closeLightbox(); await renderAlbums(); await renderPhotos(); };
}

function downloadPhoto(id) {
  const p = (window._currentPhotos||[]).find(x => x.id==id);
  if (p) triggerDownload(p.data, p.name||'photo.jpg');
}

function openLightbox(index) {
  lightboxPhotos = window._currentPhotos||[];
  lightboxIndex = index;
  showLightboxImage();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function showLightboxImage() {
  const p = lightboxPhotos[lightboxIndex];
  if (!p) return;
  document.getElementById('lightboxImg').src = p.data;
  document.getElementById('lightboxInfo').textContent = `${p.name||''}  ·  ${lightboxIndex+1} / ${lightboxPhotos.length}`;
}

function lightboxNav(dir) {
  const n = lightboxIndex+dir;
  if (n>=0 && n<lightboxPhotos.length) { lightboxIndex=n; showLightboxImage(); }
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow = ''; }
function downloadCurrentPhoto() {
  const p = lightboxPhotos[lightboxIndex];
  if (p) triggerDownload(p.data, p.name||'photo.jpg');
}

// Swipe in lightbox
document.getElementById('lightboxWrap').addEventListener('pointerdown', function(e) {
  isSwiping = true; lightboxStartX = e.clientX; this.setPointerCapture(e.pointerId);
});
document.getElementById('lightboxWrap').addEventListener('pointermove', function(e) {
  if (!isSwiping) return;
});
document.getElementById('lightboxWrap').addEventListener('pointerup', function(e) {
  if (!isSwiping) return;
  isSwiping = false;
  const dx = e.clientX - lightboxStartX;
  if (Math.abs(dx) > 80) lightboxNav(dx>0 ? -1 : 1);
});

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key==='Escape') closeLightbox();
  if (e.key==='ArrowLeft') lightboxNav(-1);
  if (e.key==='ArrowRight') lightboxNav(1);
});

function showModal(title, content) {
  document.getElementById('modalContent').innerHTML = `<h3>${title}</h3>${content}`;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target===document.getElementById('modalOverlay')) closeModal();
});

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function triggerDownload(url, name) { const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
document.getElementById('fileInput').addEventListener('click', function(){ this.value=null; });
</script>
</body>
